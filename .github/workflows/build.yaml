name: Build

on:
  schedule:
    - cron: "0 12 * * 1"
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types: [definition_update]
  workflow_dispatch:

jobs:
  build_assets:
    runs-on: ubuntu-latest
    name: Build VIA assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Use Bun
        uses: oven-sh/setup-bun@v1
      - name: Build VIA and verify the refreshed catalog
        run: npm run build:via
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: via-build
          path: public/
          retention-days: 1

  build:
    needs: build_assets
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build VIA-desktop
    steps:
      - uses: actions/checkout@v4
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Install Flatpak dependencies
        run: |
          sudo apt-get install flatpak -y
          sudo apt-get install flatpak-builder -y
          sudo apt-get install elfutils -y
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/download-artifact@v4
        with:
          name: via-build
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Set version to today
        shell: bash
        run: |
          version=$(node -p "new Date().toISOString().slice(0, 10).split('-').map(Number).join('.')")
          npm version "$version" --no-git-tag-version
      - name: Publish for ${{ matrix.os }}
        if: github.repository == 'cebby2420/via-desktop' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish -- --arch ${{ matrix.arch }}
      - name: Build for ${{ matrix.os }}
        if: github.event_name == 'pull_request' || github.repository != 'cebby2420/via-desktop'
        run: npm run make -- --arch ${{ matrix.arch }}
